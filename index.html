<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine Aleatório</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Cine Aleatório</h1>
        <p>Um toque e você descobre o próximo filme.</p>
    </header>

    <main>
        <button id="random-button" type="button">🎲 Me surpreenda</button>

        <section id="suggestion-card" class="hidden">
            <div class="card-header">
                <span id="movie-genre" class="tag">Gênero</span>
                <span id="movie-year" class="tag">Ano</span>
            </div>
            <h2 id="movie-title">Título do filme</h2>
            <p id="movie-runtime" class="meta">Duração</p>
            <p id="movie-description" class="description">Sinopse</p>
        </section>

        <p id="empty-state" class="empty-state">Clique no botão para receber uma indicação aleatória.</p>
    </main>

    <footer>
        <p>Feito para você se divertir escolhendo o próximo filme.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
